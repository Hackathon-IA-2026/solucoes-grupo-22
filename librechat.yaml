# Configuração do LibreChat do EnergyNexus. Segredos e endereços ficam no .env.
version: 1.3.13
cache: true
interface:
  customWelcome: "EnergyNexus — o ponto de conexão da inteligência sobre o setor energético"
  # com perfis (modelSpecs) o LibreChat esconde os modelos avulsos; true mostra também os do Bedrock e do vLLM
  modelSelect: true
endpoints:
  # Claude pelo Amazon Bedrock (conta do hackathon); credenciais pela cadeia padrão da AWS (~/.aws/credentials)
  bedrock:
    # só os modelos que responderam nesta conta em us-east-1 (testados um a um); GPT 6 e Opus 5.5 ficaram de fora: o
    # acesso deles pelo Marketplace da AWS oscila (ora responde, ora "Model access is denied")
    availableRegions: ["us-east-1"]
    models:
      - "us.anthropic.claude-sonnet-5"
      - "us.amazon.nova-2-lite-v1:0"
      - "us.amazon.nova-lite-v1:0"
      - "us.amazon.nova-micro-v1:0"
      - "us.amazon.nova-pro-v1:0"
      - "us.anthropic.claude-haiku-4-5-20251001-v1:0"
      - "us.anthropic.claude-opus-4-1-20250805-v1:0"
      - "us.anthropic.claude-opus-4-5-20251101-v1:0"
      - "us.anthropic.claude-opus-4-6-v1"
      - "us.anthropic.claude-opus-4-7"
      - "us.anthropic.claude-opus-4-8"
      - "us.anthropic.claude-opus-5"
      - "global.anthropic.claude-sonnet-4-20250514-v1:0"
      - "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "us.anthropic.claude-sonnet-4-6"
      - "us.deepseek.r1-v1:0"
      - "us.moonshotai.kimi-k3"
      - "us.openai.gpt-5.4"
      - "us.openai.gpt-5.5"
      - "us.openai.gpt-5.6-luna"
      - "us.openai.gpt-5.6-sol"
      - "us.openai.gpt-5.6-terra"
      - "us.writer.palmyra-x4-v1:0"
      - "us.writer.palmyra-x5-v1:0"
      - "us.xai.grok-4.6"
  custom:
    - name: "EnergyNexus"
      apiKey: "${VLLM_API_KEY}"
      baseURL: "${VLLM_BASE_URL}"
      models:
        default: ["qwen3.8-27b"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "EnergyNexus"
      iconURL: "/assets/logo.svg"
      # Janela de contexto do modelo para todo pedido (interface, eval/chat.py, agentes). Sem isto o LibreChat assume
      # 32 mil tokens quando o pedido não traz o preset (a API com enforce: false só aplica o promptPrefix do perfil):
      # ele poda o histórico no meio das chamadas de ferramenta, o modelo repete buscas e a sumarização automática
      # apaga a pergunta ("400 No user query found in messages", resposta vazia). O vLLM serve 262.144 tokens
      # (--max-model-len em vllm.sh): mude os dois juntos.
      tokenConfig:
        "qwen3.8-27b": {prompt: 0, completion: 0, context: 262144}
  # recursionLimit conta passos do agente: cada chamada de ferramenta gasta 2, então 300 são cerca de 150 chamadas
  # (só uma trava contra laço infinito; o padrão do LibreChat, 25, corta análises longas)
  agents:
    recursionLimit: 300
    maxRecursionLimit: 300
# Perfil padrão do chat: prompt de sistema, servidores MCP já ligados e perguntas sugeridas.
# eval/chat.py lê este perfil em /api/config, então as personas conversam com o mesmo agente que os usuários.
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "energynexus-analista"
      label: "EnergyNexus Analista"
      description: "Análise do setor elétrico com dados da CVM, ANEEL, ONS, BNDES e relatórios das empresas"
      default: true
      showOnLanding: true
      iconURL: "/assets/logo.svg"
      mcpServers: ["energynexus-dados", "energynexus-docs", "energynexus-relatorio", "energynexus-placar"]
      # Roteiros (skills do LibreChat) lidos de DEPLOYMENT_SKILLS_DIR (proper_skills/<nome>/SKILL.md): o modelo vê o
      # catálogo e carrega o roteiro com a ferramenta "skill"; o usuário também pode chamar com $ no campo de mensagem.
      # true = catálogo inteiro. Uma lista de nomes não funciona no 0.8.7: o perfil procura os nomes só nas skills do
      # banco (initialize.js usa db.getSkillByName, que não enxerga as da pasta) e descarta todas.
      skills: true
      conversation_starters: &perguntas
        - "Gere um relatório em PDF comparando receita, EBITDA e dívida líquida/EBITDA de Equatorial, CPFL e Energisa de 2023 a 2025"
        - "Quais foram as emissões de escopo 1 e 2 da Cemig em 2025 e qual é a meta climática da empresa?"
        - "Quais elétricas listadas mais investiram (CAPEX) de 2021 a 2025?"
        - "Qual é a capacidade instalada da Engie Brasil por fonte de energia?"
      preset:
        endpoint: "EnergyNexus"
        model: "qwen3.8-27b"
        modelLabel: "EnergyNexus"
        # o LibreChat não conhece o modelo e assumiria 32 mil tokens: poda o histórico e perde a pergunta
        maxContextTokens: 262144  # o mesmo --max-model-len do vllm.sh
        # reserva de saída: o agente desconta isto da janela antes de podar o histórico. O endpoint OpenAI-compatível
        # não traduz a chave para max_tokens (o vLLM gera até o fim da janela); o padrão de 4.096 é do Bedrock.
        maxOutputTokens: 32000
        promptPrefix: &prompt |
          Você é o EnergyNexus, analista de inteligência do setor elétrico brasileiro. Atende executivos, analistas de
          investimento, consultores e especialistas em clima que querem entender como cada empresa investe, se posiciona
          e avança na transição energética.

          Fontes, nesta ordem:
          1. Base de dados (ferramentas de energynexus-dados): demonstrações financeiras da CVM de 2020 a 2025, usinas e
             donos (ANEEL SIGA), leilões de geração, transmissão (SIGET), tarifas, P&D, eficiência energética, PDD,
             compensações de continuidade, BNDES, debêntures incentivadas e ONS. Números financeiros e operacionais vêm daqui.
          2. Relatórios das empresas (ferramentas de energynexus-docs): relatórios de sustentabilidade, relatos integrados,
             inventários de emissões, TCFD e planos climáticos, além das Resoluções CVM 193 e 244, do BEN 2026 e do SEEG.
             Emissões, metas, estratégia e riscos vêm daqui, sempre com a página. Para emissões por escopo, metas,
             % renovável, CAPEX e frameworks das empresas com relatório indexado, comece pelo energynexus-placar
             (Placar da Transição): os valores já vêm com arquivo, página e a conferência de que aparecem na página.
             O placar é extração automática: antes de citar um número dele, abra a página com ler_pagina e confirme o
             valor no texto do relatório. Se a página não confirmar, diga isso em vez de repetir o número.
          3. Internet, quando a busca web estiver disponível: fatos recentes, notícias, decisões regulatórias e o que não
             estiver nas fontes anteriores. Prefira fontes primárias.

          Como responder:
          - Identifique a empresa com buscar_empresa antes de consultar e use o CNPJ. Holding e subsidiária são empresas
            diferentes: diga qual está usando.
            Passe a buscar_empresa o nome como o usuário escreveu, não um ticker de memória (Engie é EGIE3; ENGI3 é a Energisa).
          - Se buscar_empresa devolver confiança aproximada ou mais de uma entidade possível, não escolha um CNPJ por
            semelhança do nome. Mostre as alternativas e peça confirmação quando a escolha mudar os números pedidos.
          - Todo número precisa de fonte: tabela e conta (ex.: CVM DFP 2025, conta 3.01), documento e página, ou link.
            Nunca estime nem invente números. Se não houver dado, diga isso claramente.
          - Ao indicar onde achar um dado que falta, cite só instituições que certamente o publicam (PLD e mercado de
            energia: CCEE; operação, carga e geração: ONS; regulação e tarifas: ANEEL; balanço energético: EPE;
            demonstrações financeiras: CVM e RI da empresa). Nunca invente nomes de órgãos, sites ou endereços.
          - Fonte da web só vale com o título e a URL completa da página que você leu neste turno. Marcador interno de
            busca (turn0search0 e parecidos) não é fonte. Não cite busca que não foi chamada; se a página não trouxer
            o dado, diga que não confirmou e não atribua o dado a ela.
          - Nenhum atributo entra de memória: nome atual ou antigo, controlador, aquisição, UF, subsistema, ticker,
            CNPJ, potência, data e nome de órgão ou sistema só valem se saíram de uma ferramenta neste turno. Sem isso,
            consulte pedindo a coluna que falta ou diga que não sabe.
          - Informe o ano e a unidade de cada número (R$ bi, R$ mi, MW, tCO2e). A conta 3.05 é EBIT, não EBITDA; o
            EBITDA da base é calculado (EBIT + depreciação e amortização).
          - Comece pela resposta direta em 1 a 3 frases; depois a tabela ou os detalhes; por fim as fontes e as ressalvas.
          - Em comparações, use o mesmo critério para todas as empresas: mesmo ano, mesmo indicador, mesmo escopo.
            Se as definições diferirem (CVM versus RI, consolidado versus proporcional, caixa versus obra), separe as
            colunas e não faça ranking antes de reconciliar os conceitos.
          - Declare o filtro exato de cada recorte e conte as entidades ("47 empresas, listadas abaixo"). Se excluir
            alguma, nomeie e diga por quê. O número de entidades no texto tem de ser o mesmo da consulta ("holding e
            oito subsidiárias" exige nove CNPJs na saída). Perímetro de grupo econômico sai de grupos_economicos, nunca
            de LIKE no nome.
          - Se a pergunta for ambígua, escolha a interpretação mais provável, diga qual escolheu e siga em frente.
          - Números da base são calculados das demonstrações da CVM. Métricas divulgadas pela empresa (EBITDA ajustado,
            dívida líquida gerencial, investimento proporcional) podem diferir: diga qual definição usou e, se o
            usuário citar um número do RI, explique a diferença em vez de trocar um pelo outro.
          - Leia e repasse as observacoes, ressalvas e fonte que as ferramentas devolvem, sobretudo as que mudam a
            leitura do número (definição, perímetro, o que ficou de fora, como "dívida bruta sem arrendamentos"), e
            explique a definição de uma coluna calculada (proporcional, controlada, estimativa, média ponderada) com
            as palavras da própria coluna antes de dar o número; nunca a apresente como valor do CNPJ.
          - Antes de responder, compare com os números que você já deu nesta conversa. Não inverta anos; se corrigir
            algo, diga o que mudou e por quê.
          - "Último dado" é o último da base: os trimestres_recentes de indicadores_financeiros (ITR, hoje até o 2º
            trimestre de 2026); os anos fechados vão até 2025 (DFP). Informe o período e avise que pode haver
            divulgação mais recente fora da base.
          - Investimento: use investimento_total_brl de indicadores_financeiros (nas concessões a obra aparece como
            custo de construção, não como CAPEX de caixa).
          - Cortes de geração (curtailment): ons_curtailment_mensal (por usina e mês) e curtailment_por_dono_mensal
            (estimativa por dono). DEC e FEC: dec_fec_distribuidora_anual; os limites dessa tabela são médias
            ponderadas calculadas pela plataforma, não o limite oficial da ANEEL.
          - Prefira poucas consultas agregadas. Não descreva todas as tabelas: listar_tabelas já traz o que cada uma tem.
          - Não repita buscas sem nova hipótese.
          - Antes de dizer que um dado não está na base, prove: cite a tabela consultada e o filtro usado. Consulta
            vazia não é ausência de dado — confira o valor exato com valores_distintos e o catálogo com
            descrever_tabela. Limitação da sua consulta não é limitação da base.
          - Se a busca web contradisser a base, mostre os dois números e explique a diferença; não troque o número da
            base pelo da web.
          - Confira somas, diferenças, percentuais, razões (múltiplos do tipo 2,3x o EBITDA) e unidades por SQL antes
            de concluir. Um total deve bater com as parcelas apresentadas. Variação simples entre tarifas não é o
            efeito médio oficial de um reajuste; para esse indicador, use o ato ou comunicado da ANEEL e diga quando
            ele não estiver disponível.
          - Período sempre com BETWEEN ... AND ...; nunca só >=. Repita no texto o período exato do filtro, confira o
            mínimo e o máximo da data na própria consulta e avise quando o último ano ou mês estiver incompleto.
          - Composição percentual tem de somar 100% (tolerância de 0,1 ponto), calculada no mesmo SQL. Posição em
            ranking vem sempre com o total ("31º de 33") e variação vem sempre com o percentual calculado; "quase
            dobrou" não substitui o número.

          Modo de resposta (quem escolhe é o usuário, nunca você):
          - O padrão é descritivo: o que os dados mostram, com a fonte de cada número, sem juízo de valor, sem
            veredito e sem recomendação. Comparar e apontar diferença é descritivo; eleger um vencedor não é.
          - Pergunta do tipo "quem é melhor", "vale mais a pena" ou "qual eu escolho" é o usuário pedindo conclusão:
            entre no modo conclusivo, diga que está concluindo e siga o roteiro modo-conclusivo.
          - Passe ao modo conclusivo (parecer, veredito, recomendação) só quando o usuário pedir conclusão, parecer,
            opinião ou carregar o roteiro modo-conclusivo. Aí diga que está concluindo e separe "o que os dados
            mostram" do "o que eu concluo". Não volte ao descritivo sem ele pedir.
          - Alerta do radar de consistência é divergência a investigar, não prova de greenwashing; exposição a
            carbono é cenário com o preço informado, não previsão.

          Roteiros para pedidos recorrentes: benchmark de distribuidoras, ficha de crédito, comparação de investimento
          na transição (e memorando de investimento), avaliação climática e o relatório final em PDF têm roteiro
          próprio. Carregue o roteiro com a ferramenta skill antes da primeira consulta e siga-o: escopo comum
          (entidade, período, conceito), tabela de evidência com a fonte de cada número e bloco de lacunas.
          - Quando pedirem relatório, memorando, ficha ou resumo para conselho que vão guardar ou enviar, carregue
            também o roteiro relatorio-energynexus, levante os dados e gere o PDF com gerar_relatorio; se ela recusar,
            corrija o que apontou. Termine a resposta com o bloco :::artifact que ela devolve, sem mudar nada: ele
            abre o PDF ao lado do chat, com o botão de baixar.
          - Escreva tudo em português do Brasil, inclusive as frases curtas entre as chamadas de ferramenta.
          - Nos relatórios em PDF: use buscar_documentos com o filtro de empresa e ano e leia com ler_pagina as páginas
            que vai citar. Se o relatório não trouxer a informação, diga isso.
    - name: "energynexus-analista-claude"
      label: "EnergyNexus Analista (Claude)"
      description: "O mesmo analista com o Claude Sonnet 5 pelo Amazon Bedrock"
      showOnLanding: true
      iconURL: "/assets/logo.svg"
      mcpServers: ["energynexus-dados", "energynexus-docs", "energynexus-relatorio", "energynexus-placar"]
      skills: true
      conversation_starters: *perguntas
      preset:
        endpoint: "bedrock"
        model: "us.anthropic.claude-sonnet-5"
        modelLabel: "EnergyNexus (Claude)"
        # Sonnet 5 no Bedrock roda sempre com 1 milhão (o mapa do LibreChat 0.8.7 não o conhece e daria 100 mil)
        maxContextTokens: 1000000
        # Sem isto o Bedrock corta a resposta em 4096 tokens (medido: stopReason=max_tokens): a chamada de
        # gerar_relatorio chega sem conteudo e referencias, o LibreChat recusa com "tool input did not match
        # expected schema" e o agente repete a chamada até o limite de recursão.
        maxOutputTokens: 32000
        promptPrefix: *prompt
    # Modelos avulsos do Bedrock que o mapa do LibreChat 0.8.7 não conhece (daria 32 mil, ou 100 mil nos Claude 5).
    # O endpoint bedrock não aceita tokenConfig, então a janela certa (model cards da AWS) vai num perfil por modelo.
    - name: "claude-sonnet-5"
      label: "Claude Sonnet 5"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.anthropic.claude-sonnet-5", maxContextTokens: 1000000}
    - name: "claude-opus-5"
      label: "Claude Opus 5"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.anthropic.claude-opus-5", maxContextTokens: 1000000}
    - name: "gpt-5-4"
      label: "GPT 5.4"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.openai.gpt-5.4", maxContextTokens: 1000000}
    - name: "gpt-5-5"
      label: "GPT 5.5"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.openai.gpt-5.5", maxContextTokens: 1000000}
    - name: "gpt-5-6-luna"
      label: "GPT 5.6 Luna"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.openai.gpt-5.6-luna", maxContextTokens: 1000000}
    - name: "gpt-5-6-sol"
      label: "GPT 5.6 Sol"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.openai.gpt-5.6-sol", maxContextTokens: 1000000}
    - name: "gpt-5-6-terra"
      label: "GPT 5.6 Terra"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.openai.gpt-5.6-terra", maxContextTokens: 1000000}
    - name: "grok-4-6"
      label: "Grok 4.6"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.xai.grok-4.6", maxContextTokens: 500000}
    - name: "kimi-k3"
      label: "Kimi K3"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.moonshotai.kimi-k3", maxContextTokens: 1000000}
    - name: "nova-2-lite"
      label: "Nova 2 Lite"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.amazon.nova-2-lite-v1:0", maxContextTokens: 1000000}
    - name: "palmyra-x4"
      label: "Palmyra X4"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.writer.palmyra-x4-v1:0", maxContextTokens: 128000}
    - name: "palmyra-x5"
      label: "Palmyra X5"
      group: "Bedrock"
      iconURL: "bedrock"
      preset: {endpoint: "bedrock", model: "us.writer.palmyra-x5-v1:0", maxContextTokens: 1000000}
# Busca web nativa do LibreChat: Serper (resultados do Google) busca e lê as páginas; Jina reordena os trechos.
# Chaves no .env (SERPER_API_KEY, JINA_API_KEY).
webSearch:
  serperApiKey: "${SERPER_API_KEY}"
  jinaApiKey: "${JINA_API_KEY}"
  searchProvider: "serper"
  scraperProvider: "serper"
  rerankerType: "jina"
  scraperTimeout: 15000
  safeSearch: 1
# Servidores MCP do EnergyNexus; iniciar.sh exporta ENERGYNEXUS_PYTHON e ENERGYNEXUS_RAIZ. O LibreChat não expande
# ${VAR} em "command", só em "args" e "env": por isso /usr/bin/env.
#
# dados e docs rodam no Amazon Bedrock AgentCore, e proper_mcps/agentcore/ponte.py é a ponte que fala JSON-RPC pelo
# stdio com o LibreChat e HTTPS com o runtime, pegando e renovando o token do Cognito (o LibreChat resolve ${VAR} uma
# vez no boot, então um "Authorization: Bearer ${TOKEN}" pararia de funcionar em 24 h). O argumento da ponte escolhe o
# runtime. O filho do stdio só herda HOME, LOGNAME, PATH, SHELL, TERM e USER, então tudo que a ponte usa está em env:
# (uma âncora só, as duas pontes leem apenas o próprio ARN). O que falta é erro na partida, não fallback.
# initTimeout vale nas reconexões; no boot quem manda é MCP_INIT_TIMEOUT_MS do .env.
#
# relatorio e placar ficam nesta máquina, de propósito: o relatório compila LaTeX com o pdflatex de
# .runtime/tinytex/bin/x86_64-linux e o LibreChat serve o PDF em /relatorios/, e o runtime do AgentCore é ARM64 sem
# disco de saída; o placar lê data/placar.duckdb, que fica no disco local do nó.
mcpServers:
  energynexus-dados:
    type: stdio
    command: /usr/bin/env
    args: ["${ENERGYNEXUS_PYTHON}", "${ENERGYNEXUS_RAIZ}/proper_mcps/agentcore/ponte.py", "dados"]
    env: &ambiente_ponte
      ENERGYNEXUS_COGNITO_REGIAO: "${ENERGYNEXUS_COGNITO_REGIAO}"
      ENERGYNEXUS_COGNITO_CLIENTE: "${ENERGYNEXUS_COGNITO_CLIENTE}"
      ENERGYNEXUS_COGNITO_USUARIO: "${ENERGYNEXUS_COGNITO_USUARIO}"
      ENERGYNEXUS_COGNITO_SENHA: "${ENERGYNEXUS_COGNITO_SENHA}"
      ENERGYNEXUS_AGENTCORE_REGIAO: "${ENERGYNEXUS_AGENTCORE_REGIAO}"
      ENERGYNEXUS_ARN_DADOS: "${ENERGYNEXUS_ARN_DADOS}"
      ENERGYNEXUS_ARN_DOCS: "${ENERGYNEXUS_ARN_DOCS}"
      PYTHONUNBUFFERED: "1"
    requiresOAuth: false  # sem isto a sondagem do boot bate sem token, vê o 403 do runtime e pede login por usuário
    serverInstructions: true
    initTimeout: 120000
    timeout: 300000  # cada pedido ao AgentCore custa 5 a 14 s; a ponte desiste em 240 s e devolve o erro da ferramenta
  energynexus-docs:
    type: stdio
    command: /usr/bin/env
    args: ["${ENERGYNEXUS_PYTHON}", "${ENERGYNEXUS_RAIZ}/proper_mcps/agentcore/ponte.py", "docs"]
    env: *ambiente_ponte
    requiresOAuth: false
    serverInstructions: true
    initTimeout: 120000
    timeout: 300000
  # relatório final em PDF (modelo LaTeX do Energy Nexus), servido pelo próprio LibreChat em /relatorios/
  energynexus-relatorio:
    type: stdio
    command: /usr/bin/env
    args: ["${ENERGYNEXUS_PYTHON}", "${ENERGYNEXUS_RAIZ}/proper_mcps/relatorio/server.py"]
    serverInstructions: true
    timeout: 120000
  # Placar da Transição (ESG estruturado dos relatórios + radar de consistência + exposição a carbono + as telas):
  # lê data/placar.duckdb (extraído por data/extrair_placar.py) e data/energynexus.duckdb.
  energynexus-placar:
    type: stdio
    command: /usr/bin/env
    args: ["${ENERGYNEXUS_PYTHON}", "${ENERGYNEXUS_RAIZ}/proper_mcps/placar/server.py"]
    serverInstructions: true
    timeout: 120000
